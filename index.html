<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Class Registration</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-r from-indigo-50 to-blue-100 flex items-center justify-center p-4">

  <form action="https://formspree.io/f/xyznvgee" method="POST" class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-lg space-y-5">
    <h2 class="text-2xl font-bold text-center text-indigo-600">Math Class Registration</h2>
    <p class="text-gray-500 text-center">Fill out the form below to register for the new math class.</p>

    <!-- Student Name -->
    <div>
      <label class="block text-sm font-semibold text-gray-700">Student Name</label>
      <input type="text" name="student_name" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none">
    </div>

    <!-- Class Time -->
    <div>
      <label class="block text-sm font-semibold text-gray-700">Preferred Class Time</label>
      <select name="class_time" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none">
        <option value="">Select time</option>
        <option>8:00 AM - 9:00 AM</option>
        <option>9:30 AM - 10:30 AM</option>
        <option>11:00 AM - 12:00 PM</option>
        <option>2:00 PM - 3:00 PM</option>
        <option>4:00 PM - 5:00 PM</option>
      </select>
    </div>

    <!-- Math Subject -->
    <div>
      <label class="block text-sm font-semibold text-gray-700">Math Subject</label>
      <select name="subject" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none">
        <option value="">Select subject</option>
        <option>Arithmetic</option>
        <option>Algebra</option>
        <option>Equations</option>
        <option>Geometry</option>
        <option>Calculus</option>
      </select>
    </div>

    <!-- Gender -->
    <div>
      <label class="block text-sm font-semibold text-gray-700 mb-1">Gender</label>
      <div class="flex items-center gap-4">
        <label><input type="radio" name="gender" value="Male" required> Male</label>
        <label><input type="radio" name="gender" value="Female"> Female</label>
      </div>
    </div>

    <!-- Age -->
    <div>
      <label class="block text-sm font-semibold text-gray-700">Age</label>
      <input type="number" name="age" min="5" max="25" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none">
    </div>

    <!-- School Grade -->
    <div>
      <label class="block text-sm font-semibold text-gray-700">School Grade</label>
      <input type="text" name="school_grade" required placeholder="e.g. Grade 8" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none">
    </div>

    <!-- Submit -->
    <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-lg hover:bg-indigo-700 transition">
      Submit Registration
    </button>

    <!-- Success Message (optional) -->
    <p class="text-center text-sm text-gray-500 mt-2">You will receive a confirmation soon.</p>
  </form>

</body>
</html>
